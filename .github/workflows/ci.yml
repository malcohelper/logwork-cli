name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        if: runner.os != 'macOS'
        run: npm test

      # Same suite, with Node's built-in coverage and minimum thresholds.
      - name: Run tests with coverage
        if: runner.os == 'macOS'
        run: npm run test:coverage

      - name: Verify Windows Credential Manager integration
        if: runner.os == 'Windows'
        run: npm run test:windows-credential

      # Real libsecret round trip: a private D-Bus session with an unlocked
      # GNOME Keyring.
      - name: Verify Linux Secret Service integration
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsecret-tools gnome-keyring dbus-x11
          dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && TEST_LINUX_SECRET_SERVICE=1 npm run test:linux-credential'

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check package contents
        run: npm pack --dry-run

      - name: Check whitespace
        run: git diff --check

  # Linux inside WSL on a Windows runner: the full suite as plain Linux, then
  # the real interop tests (Windows Credential Manager through powershell.exe,
  # Task Scheduler through schtasks.exe).
  wsl:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up WSL
        uses: Vampire/setup-wsl@v7.2.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: curl ca-certificates xz-utils git

      - name: Install Node.js 22, run the suite and the WSL interop tests
        shell: wsl-bash {0}
        run: |
          file=$(curl -fsSL https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt | awk '/linux-x64\.tar\.xz$/ {print $2}')
          mkdir -p "$HOME/node"
          curl -fsSL "https://nodejs.org/dist/latest-v22.x/$file" | tar -xJ -C "$HOME/node" --strip-components=1
          export PATH="$HOME/node/bin:$PATH"
          node --version
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global --add safe.directory '*'
          # A clone inside WSL has LF files, unlike the Windows checkout.
          rm -rf "$HOME/repo" && git clone --quiet --no-hardlinks "$PWD" "$HOME/repo" && cd "$HOME/repo"
          npm ci
          npm test
          TEST_WSL_INTEROP=1 node --import ./test/helpers/setup.mjs --test test/wsl.test.mjs
